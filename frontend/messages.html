<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Messages · VibeHive</title>
  <meta name="description" content="Your private chats on VibeHive.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <!-- Installable app (PWA) -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#F7F4EE" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121016" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="VibeHive">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css?v=10">
  <script src="js/theme-boot.js?v=10"></script>
</head>
<body class="app">
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main" id="main">
      <div class="page-head">
        <div>
          <h1>Messages</h1>
          <p>Private chats with people you follow each other with.</p>
        </div>
        <button class="btn btn-primary" type="button" data-new-chat>New chat</button>
      </div>
      <div class="search chat-search">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input class="input" type="search" id="chat-filter" placeholder="Search chats..." aria-label="Search chats" autocomplete="off">
      </div>
      <div class="card chat-list" id="chat-list"></div>
    </main>

    <aside class="rightbar" id="rightbar"></aside>
  </div>

  <script src="js/config.js?v=10"></script>
  <script src="js/api.js?v=10"></script>
  <script src="js/app.js?v=10"></script>
  <script src="js/vibes.js?v=10"></script>
  <script src="js/messages.js?v=10"></script>
  <script src="js/pwa.js?v=10"></script>
</body>
</html>
