<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Home · VibeHive</title>
  <meta name="description" content="VibeHive — Share the vibe. Join the hive.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <!-- Installable app (PWA) -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#F7F4EE" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121016" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="VibeHive">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css?v=10">
  <script src="js/theme-boot.js?v=10"></script>
</head>
<body class="app">
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main" id="main">
      <section class="greeting">
        <h1 id="greeting-title">What's the vibe today? 👋</h1>
        <p id="greeting-sub">Share something with the hive.</p>
      </section>

      <!-- Desktop: inline composer. Mobile: a prompt that opens the composer sheet -->
      <div id="composer-slot"></div>
      <button class="card composer-prompt" type="button" data-action="compose">
        <span id="prompt-avatar"></span>
        <span class="fake-input">Share something with the hive...</span>
      </button>

      <p class="hive-note">🔒 Your hive shows posts from people who <strong>follow each other</strong> with you.</p>

      <div id="feed"></div>
    </main>

    <aside class="rightbar" id="rightbar"></aside>
  </div>

  <script src="js/config.js?v=10"></script>
  <script src="js/api.js?v=10"></script>
  <script src="js/app.js?v=10"></script>
  <script src="js/vibes.js?v=10"></script>
  <script src="js/posts.js?v=10"></script>
  <script src="js/feed.js?v=10"></script>
  <script src="js/pwa.js?v=10"></script>
</body>
</html>
